name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n wsl-ai-doctor.sh

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      # -S warning:忽略 style/info 層級的建議,只擋真正會出問題的寫法
      - name: Run shellcheck
        run: shellcheck -S warning wsl-ai-doctor.sh

  smoke:
    name: Smoke test (non-WSL runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File is executable
        run: test -x wsl-ai-doctor.sh

      - name: --version
        run: ./wsl-ai-doctor.sh --version

      - name: --help
        run: ./wsl-ai-doctor.sh --help

      # 未知選項必須以 64 結束(sysexits.h 的 EX_USAGE),而非默默忽略
      - name: Unknown option exits 64
        run: |
          set +e
          ./wsl-ai-doctor.sh --definitely-not-an-option >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 64 || { echo "期望離開碼 64,實際 $rc"; exit 1; }

      # GitHub runner 不是 WSL,預設應拒絕執行並回報離開碼 3
      - name: Refuses to run outside WSL (exit 3)
        run: |
          set +e
          out=$(./wsl-ai-doctor.sh --no-color 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 3 || { echo "期望離開碼 3,實際 $rc"; exit 1; }
          echo "$out" | grep -q "不在 WSL 環境中" || { echo "缺少非 WSL 說明訊息"; exit 1; }

      # --allow-non-wsl 下實際跑完所有檢查:驗證 Node.js、PATH、npm 全域
      # 這幾段邏輯在真實環境中不會爆,且 WSL 專屬檢查確實被標記為 SKIP
      - name: Full run with --allow-non-wsl
        run: |
          set +e
          out=$(./wsl-ai-doctor.sh --no-color --allow-non-wsl 2>&1)
          rc=$?
          set -e
          echo "$out"
          # 0 = 全過,1 = 有 WARN;兩者都代表腳本正常跑完
          test "$rc" -eq 0 -o "$rc" -eq 1 || { echo "期望離開碼 0 或 1,實際 $rc"; exit 1; }
          echo "$out" | grep -q "\[SKIP\] 非 WSL 環境" || { echo "WSL 專屬檢查未標記 SKIP"; exit 1; }
          echo "$out" | grep -q "健檢總結" || { echo "未印出總結"; exit 1; }

      # 非 WSL 環境不得給出 WSL 專屬的修復建議(這是階段 1 修掉的誤導性輸出)
      - name: No misleading WSL advice on plain Linux
        run: |
          out=$(./wsl-ai-doctor.sh --no-color --allow-non-wsl 2>&1 || true)
          if echo "$out" | grep -q "appendWindowsPath"; then
            echo "非 WSL 環境卻建議修改 /etc/wsl.conf"; exit 1
          fi
          echo "OK:未出現 WSL 專屬建議"

      - name: Color control (--no-color / auto-detect)
        run: |
          ./wsl-ai-doctor.sh --no-color --allow-non-wsl > out.txt 2>&1 || true
          if grep -q $'\033' out.txt; then echo "--no-color 仍輸出 ANSI 碼"; exit 1; fi
          ./wsl-ai-doctor.sh --allow-non-wsl > out2.txt 2>&1 || true
          if grep -q $'\033' out2.txt; then echo "重導向到檔案時未自動關閉顏色"; exit 1; fi
          echo "OK:顏色控制正常"

      - name: --skip-network
        run: ./wsl-ai-doctor.sh --allow-non-wsl --skip-network --no-color || test $? -le 1

      # --json 必須輸出合法 JSON,且結構欄位齊全、離開碼與文字模式一致
      - name: --json produces valid JSON
        run: |
          set +e
          ./wsl-ai-doctor.sh --allow-non-wsl --json > out.json
          rc_json=$?
          ./wsl-ai-doctor.sh --allow-non-wsl --no-color > /dev/null 2>&1
          rc_text=$?
          set -e
          cat out.json
          python3 -m json.tool out.json > /dev/null || { echo "不是合法 JSON"; exit 1; }
          test "$rc_json" -eq "$rc_text" || { echo "JSON 與文字模式離開碼不一致:$rc_json vs $rc_text"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("out.json"))
          for k in ("tool","version","generated_at","lang","environment","summary","exit_code","checks"):
              assert k in d, f"缺少頂層欄位 {k}"
          for k in ("is_wsl","wsl_version","kernel","distro","systemd"):
              assert k in d["environment"], f"缺少 environment.{k}"
          for k in ("pass","warn","fail","skip","total","health"):
              assert k in d["summary"], f"缺少 summary.{k}"
          assert d["environment"]["is_wsl"] is False, "runner 不是 WSL,is_wsl 應為 false"
          assert d["summary"]["skip"] > 0, "非 WSL 環境應有 SKIP 項目"
          for c in d["checks"]:
              assert c["id"] and c["section"] and c["status"], "檢查項目缺少 id/section/status"
              assert isinstance(c["hints"], list) and isinstance(c["commands"], list)
          print(f"OK:{len(d['checks'])} 筆檢查,health={d['summary']['health']}")
          PY

      # 非 WSL 環境下的 --json 閘門:仍須輸出合法 JSON 並回報 exit 3
      - name: --json outside WSL reports not_applicable
        run: |
          set +e
          ./wsl-ai-doctor.sh --json > gate.json
          rc=$?
          set -e
          cat gate.json
          test "$rc" -eq 3 || { echo "期望離開碼 3,實際 $rc"; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open("gate.json"))
          assert d["environment"]["is_wsl"] is False
          assert d["summary"]["health"] == "not_applicable", d["summary"]["health"]
          assert d["checks"] == [], "未執行檢查時 checks 應為空"
          assert d["exit_code"] == 3
          print("OK:非 WSL 閘門的 JSON 正確")
          PY

      # --lang en 必須真的切換語言,且沒有漏翻的訊息鍵
      - name: --lang en switches diagnostics to English
        run: |
          out=$(./wsl-ai-doctor.sh --allow-non-wsl --no-color --lang en 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Summary (" || { echo "未切換到英文總結"; exit 1; }
          echo "$out" | grep -q "Node.js version" || { echo "未切換到英文章節標題"; exit 1; }
          if echo "$out" | grep -q "<missing:"; then
            echo "有訊息鍵缺少翻譯"; exit 1
          fi
          # 排除路徑後不應再有中文(Windows 使用者名稱可能本身是中文)
          if echo "$out" | grep -v '/mnt/' | grep -qP '[\x{4e00}-\x{9fff}]'; then
            echo "英文模式仍有未翻譯的中文:"
            echo "$out" | grep -v '/mnt/' | grep -P '[\x{4e00}-\x{9fff}]'
            exit 1
          fi
          echo "OK:英文輸出完整"

      - name: --lang rejects unsupported values
        run: |
          set +e
          ./wsl-ai-doctor.sh --lang klingon >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 64 || { echo "期望離開碼 64,實際 $rc"; exit 1; }
          echo "OK"

      # --help 應反映語言,且與參數順序無關
      - name: --help respects --lang regardless of order
        run: |
          ./wsl-ai-doctor.sh --help --lang en | grep -q "Machine-readable JSON output" \
            || { echo "--help --lang en 未輸出英文說明"; exit 1; }
          ./wsl-ai-doctor.sh --lang en --help | grep -q "Machine-readable JSON output" \
            || { echo "--lang en --help 未輸出英文說明"; exit 1; }
          ./wsl-ai-doctor.sh --help | grep -q "輸出機器可讀的 JSON" \
            || { echo "預設說明未使用中文"; exit 1; }
          echo "OK"
